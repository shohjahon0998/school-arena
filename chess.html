
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCHOOL ARENA - Shaxmat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;
 background:#eaf5ef;color:#173c30;
 font-family:Arial,sans-serif;text-align:center
}
.card{
 background:white;padding:18px;
 border-radius:20px;margin:15px auto;
 max-width:480px;box-shadow:0 5px 20px #0001
}
h1{color:#16865c}
#board{
 display:grid;grid-template-columns:repeat(8,1fr);
 width:100%;max-width:440px;margin:auto;
 border:4px solid #173c30
}
.square{
 aspect-ratio:1;display:flex;
 align-items:center;justify-content:center;
 font-size:clamp(25px,8vw,43px);
 cursor:pointer;position:relative
}
.light{background:#eeeed2}
.dark{background:#769656}
.selected{background:#f6f669!important}
.target:after{
 content:"";width:25%;height:25%;
 border-radius:50%;background:#16865c99;
 position:absolute
}
button{
 background:#16865c;color:white;border:0;
 padding:14px 22px;border-radius:12px;
 font-size:16px;margin:6px
}
#status{font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>♟ SCHOOL ARENA</h1>
<h2>SHAXMAT</h2>
<p>Oq va qora — 2 o‘yinchi</p>
<div id="status">Yuklanmoqda...</div>
</div>

<div class="card">
<div id="board"></div>
<br>
<button onclick="resetGame()">🔄 Yangi o‘yin</button>
<button onclick="undoMove()">↩️ Orqaga</button>
<button onclick="location.href='index.html'">🏠 Bosh sahifa</button>
</div>

<div class="card">
<h3>📋 O‘yin holati</h3>
<p id="info">Oq donalar yuradi</p>
</div>

<script>
const game = new Chess();

const symbols = {
 wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
 bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

let selected = null;
let targets = [];

function render(){
 const board = document.getElementById("board");
 board.innerHTML = "";

 const position = game.board();

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const squareName = "abcdefgh"[c]+(8-r);
   const piece = position[r][c];
   const cell = document.createElement("div");

   cell.className = "square "+((r+c)%2?"dark":"light");

   if(selected===squareName)
    cell.classList.add("selected");

   if(targets.includes(squareName))
    cell.classList.add("target");

   if(piece){
    cell.textContent = symbols[piece.color+piece.type];
   }

   cell.onclick = ()=>clickSquare(squareName);
   board.appendChild(cell);
  }
 }

 updateStatus();
}

function clickSquare(square){
 if(game.game_over()) return;

 const piece = game.get(square);

 if(selected){
  const move = game.move({
   from:selected,
   to:square,
   promotion:"q"
  });

  if(move){
   selected=null;
   targets=[];
   render();
   return;
  }
 }

 if(piece && piece.color===game.turn()){
  selected=square;
  targets=game.moves({
   square:square,
   verbose:true
  }).map(m=>m.to);
 }else{
  selected=null;
  targets=[];
 }

 render();
}

function updateStatus(){
 const status=document.getElementById("status");
 const info=document.getElementById("info");

 if(game.in_checkmate()){
  status.textContent="🏆 MOT! O‘yin tugadi!";
 }else if(game.in_draw()){
  status.textContent="🤝 DURANG!";
 }else{
  status.textContent=
   (game.turn()==="w"?"⚪ Oq":"⚫ Qora")+" navbatida";
  if(game.in_check()) status.textContent+=" — SHOH!";
 }

 info.textContent="Yurishlar soni: "+game.history().length;
}

function resetGame(){
 game.reset();
 selected=null;
 targets=[];
 render();
}

function undoMove(){
 game.undo();
 selected=null;
 targets=[];
 render();
}

render();
</script>
</body>
</html>
